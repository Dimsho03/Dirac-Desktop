name: Bug report
description: Report a reproducible problem in Dirac Desktop
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real VPN profiles, UUIDs, passwords, private keys, access tokens, or unredacted credentials.
  - type: input
    id: version
    attributes:
      label: Dirac version / commit
      placeholder: e.g. 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact private endpoints, UUIDs, keys, tokens, and credentials before posting.
    validations:
      required: false